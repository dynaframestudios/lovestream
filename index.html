<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LOVESTREAM</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body>

  <!-- ============ LOGIN GATE ============ -->
  <div id="screen-login">
    <form id="login-form" class="login-box">
      <i class="fa-solid fa-lock login-icon"></i>
      <h1 class="picker-title">LOVESTREAM</h1>
      <p class="login-sub">This one's just for us.</p>
      <input
        type="password"
        id="login-password"
        class="login-input"
        placeholder="Password"
        autocomplete="current-password"
        autofocus
      />
      <button type="submit" class="btn btn-primary login-submit">
        <i class="fa-solid fa-right-to-bracket"></i> Enter
      </button>
      <p class="login-error" id="login-error"></p>
    </form>
  </div>

  <!-- ============ PROFILE PICKER ============ -->
  <div id="screen-profiles" class="hidden">
    <h1 class="picker-title">Who's watching?</h1>
    <div id="profile-grid"></div>
  </div>

  <!-- ============ BROWSE SCREEN ============ -->
  <div id="screen-browse" class="hidden">
    <header class="topbar">
      <span class="brand">LOVE<span>STREAM</span></span>
      <div class="topbar-right">
        <span class="days-together hidden" id="days-together"></span>
        <button class="icon-btn" id="search-toggle" aria-label="Search"><i class="fa-solid fa-magnifying-glass"></i></button>
        <span class="who"><span class="who-dot"></span><span id="whoami"></span></span>
      </div>
    </header>

    <div class="search-bar hidden" id="search-bar">
      <input type="text" id="search-input" class="search-input" placeholder="Search shows..." />
    </div>

    <section class="hero" id="hero">
      <video id="hero-video" class="hero-video hidden" muted loop playsinline></video>
      <div class="hero-content">
        <span class="hero-eyebrow">Top Pick For You</span>
        <h1 class="hero-title" id="hero-title"></h1>
        <p class="hero-tagline" id="hero-tagline"></p>
        <div class="hero-meta" id="hero-meta"></div>
        <p class="hero-desc" id="hero-desc"></p>
        <div class="hero-actions">
          <button class="btn btn-primary" id="hero-play"><i class="fa-solid fa-play"></i> Play</button>
          <button class="btn btn-secondary" id="hero-info"><i class="fa-solid fa-circle-info"></i> More Info</button>
        </div>
      </div>
    </section>

    <main id="rows"></main>
  </div>

  <!-- ============ MODAL ============ -->
  <div id="modal-backdrop" class="hidden">
    <div class="modal">
      <div class="modal-art" id="modal-art">
        <video id="modal-video" class="modal-video hidden" muted loop playsinline autoplay></video>
        <button id="modal-close" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <h2 class="modal-title" id="modal-title"></h2>
        <div class="modal-meta" id="modal-meta"></div>
        <p class="modal-desc" id="modal-desc"></p>
        <p class="modal-cast" id="modal-cast"></p>
        <p class="modal-genres" id="modal-genres"></p>
        <h3 class="modal-episodes-heading">Episodes</h3>
        <ul id="modal-episodes"></ul>
      </div>
    </div>
  </div>

  <!-- ============ EPISODE PLAYER (full memories playback) ============ -->
  <div id="player-overlay" class="hidden">
    <div class="player-shell">
      <button id="player-close" aria-label="Close player"><i class="fa-solid fa-xmark"></i></button>
      <video id="player-video" class="player-video" controls playsinline></video>
      <div class="player-caption">
        <span class="player-title" id="player-title"></span>
        <span class="player-sub" id="player-sub"></span>
      </div>
    </div>
  </div>

  <audio id="click-sound" src="assets/sounds/click.mp3" preload="auto"></audio>

  <script src="js/shows.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
